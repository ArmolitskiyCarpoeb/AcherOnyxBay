texts:
  motd: |
    <h1>Добро пожаловать!</h1>
    <p><b>Это место для тех, кто хочет поиграть в СС13. Правила очень просты: не будь мудаком и отыгрывай свою роль.</b></p>
    <p><b>Билд: Модифицированный OnyxBay, который достаточно приближен к классической станции. Однако здесь - другая карта, немного респрайтов, небольшие новые фичи, более летальная боёвка и разные другие изменения.  </b><br></p>
  heads: |
    <html>
      <head>
        <meta charset="utf-8"/>
        <style>
          h1 {color: white;}
          p {color: white;}
          body {background: #1E1E1E; font-size: 18px;}
          a {color: cyan;}
        </style>
      </head>
      <body>
        <center>
          <h1>Внимание!</h1>
          <p>Ты ОБЯЗАН руководить подонками.</p>
        </center>
      </body>
    </html>
