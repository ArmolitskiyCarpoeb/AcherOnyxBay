[gamemode]
## Set to true to scale amount of traitors based on amount of players.
traitor_scaling = false

## Uncomment and set value to disable antag objectives.
## "none" enable all
## "verb" to allow getting objectives via special verb
## "all" disable them at all
disable_objectives = "none"

## Make ERT's be only called by admins
ert_admin_only = true

## If security is prohibited from being most antagonists
protect_roles_from_antagonist = true

[gamemode.probabilities]
## Probablities for game modes chosen in "secret" and "random" modes.
## Default probablity is 1, increase to make that mode more likely to be picked.
## Set to 0 to disable that mode.
extended = 0
traitor = 5
changeling = 0
wizard = 0
malfunction = 0
ninja = 0
revolution = 0
cult = 0
nuke = 0
meteor = 0
calamity = 0
## Deity.
god = 0
## Cult & wizard.
conflux = 0
## Ninja & traitor.
intrigue = 0
## Changelings & wizards.
lizard = 0
## Changeling, malf & renegade.
paranoia = 0
## Changeling & traitor.
traitorling = 1
## Revolution & wizard.
unity = 0
## Cult & revolution.
uprising = 0
## Ninja & wizard.
visitors = 0
## Nuke & revolution.
siege = 0
heist = 0
## Deathsquad & xenophage.
bughunt = 0
## Nuke & heist.
crossfire = 0
## Borer, changeling & xenophage.
infestation = 0
